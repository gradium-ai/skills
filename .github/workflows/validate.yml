name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install tested dependencies and media tools
        run: |
          python -m pip install -r requirements.txt pip-audit==2.10.1
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Validate skill packages
        run: python scripts/validate_repo.py
      - name: Test scripts without provider calls
        run: python -m unittest discover -s tests -v
      - name: Audit runtime dependencies
        run: python -m pip_audit -r requirements.txt --no-deps --disable-pip --strict
      - name: Scan history and current files for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git . --log-opts=--all --redact=100 --no-banner
          "$RUNNER_TEMP/gitleaks" dir . --redact=100 --no-banner
